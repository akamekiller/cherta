# Озвучка японских колод моделью Kokoro-82M (голос jf_alpha, японский G2P misaki[ja]).
# Запускается сама при изменении японских колод или вручную. Озвучивает только новые слова, порциями по 500.
name: Озвучка японских слов

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/ja-*.tsv", "tts/generate_ja.py", ".github/workflows/tts-ja.yml"]

permissions:
  contents: write
  actions: write

concurrency:
  group: tts
  cancel-in-progress: false

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Установка
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "kokoro>=0.9.4" "misaki[ja]>=0.9.4" soundfile unidic-lite
          python -m unidic download || echo "unidic: словарь не скачался, пробуем с unidic-lite"
      - name: Озвучка порциями с сохранением после каждой
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 8); do
            python tts/generate_ja.py --limit 500 | tee log.txt
            git add site/audio/ja
            if git diff --cached --quiet; then echo "нечего сохранять"; break; fi
            git commit -q -m "Озвучка японских слов (порция $i)"
            git pull -q --rebase && git push -q
            grep -q "осталось: 0" log.txt && break
          done
      - name: Обновить сайт
        run: gh workflow run pages.yml
        env:
          GH_TOKEN: ${{ github.token }}
