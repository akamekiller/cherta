# Озвучка слов колод моделью Kokoro (голос zf_047).
# Запускается сама при изменении колод (data/*.tsv) или вручную. Озвучивает только новые слова, порциями по 1000.
name: Озвучка слов

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/*.tsv", "data/decks.json", "tts/generate_all.py", "tts/phonemes.py", "tts/redo.txt"]

permissions:
  contents: write
  actions: write

concurrency:
  group: tts
  cancel-in-progress: false

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Установка
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet -r tts/requirements.txt
      - name: Озвучка порциями с сохранением после каждой
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 12); do
            python tts/generate_all.py --limit 1000 | tee log.txt
            git add site/audio
            if git diff --cached --quiet; then echo "нечего сохранять"; break; fi
            git commit -q -m "Озвучка слов (порция $i)"
            git pull -q --rebase && git push -q
            grep -q "осталось: 0" log.txt && break
          done
      - name: Обновить сайт
        run: gh workflow run pages.yml
        env:
          GH_TOKEN: ${{ github.token }}
